<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#090d16"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#6366f1"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <!-- Background with rounded squircle -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Subtle Sanctuary cross / aperture geometry -->
  <circle cx="256" cy="256" r="160" fill="none" stroke="#334155" stroke-width="6" stroke-dasharray="8 8" opacity="0.6"/>
  
  <!-- Media Broadcast Aperture & Cross Symbol -->
  <g filter="url(#glow)">
    <!-- Stylized Cross Beam -->
    <rect x="244" y="112" width="24" height="288" rx="12" fill="url(#accent)"/>
    <rect x="156" y="200" width="200" height="24" rx="12" fill="url(#accent)"/>
    <!-- Central Camera Lens / Broadcast Waves -->
    <circle cx="256" cy="212" r="48" fill="#0f172a" stroke="url(#accent)" stroke-width="14"/>
    <circle cx="256" cy="212" r="22" fill="#38bdf8"/>
    <!-- Broadcast Waves -->
    <path d="M 196 142 A 80 80 0 0 1 316 142" fill="none" stroke="#38bdf8" stroke-width="10" stroke-linecap="round" opacity="0.9"/>
    <path d="M 172 116 A 114 114 0 0 1 340 116" fill="none" stroke="#6366f1" stroke-width="8" stroke-linecap="round" opacity="0.6"/>
  </g>

  <!-- Tag / QR Code Scanner Frame Corners -->
  <path d="M 100 140 L 100 100 L 140 100" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 372 100 L 412 100 L 412 140" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 100 372 L 100 412 L 140 412" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 372 412 L 412 412 L 412 372" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
